name: Source build stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  container:
    name: Build and exercise runtime container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Load locally for smoke testing; registry credentials and pushes belong to the later publication stage.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: resumeme:ci
          build-args: |
            RELEASE_TAG=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha,scope=resumeme-container-amd64
          cache-to: type=gha,mode=max,scope=resumeme-container-amd64
      - name: Compile a synthetic resume in the installed container
        run: bash scripts/ci/check-container.sh

      # Archive the tested image rather than asking deploy to rebuild from potentially changed external dependencies.
      - name: Save the tested image for tag publication
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p .cache/container
          docker save resumeme:ci | gzip > .cache/container/resumeme.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/')
        with:
          name: resumeme-container
          path: .cache/container/resumeme.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  package:
    name: Build Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main

      # Build tagged metadata once here; PyPI publishes these exact distributions after the common verification gate.
      - name: Build the wheel and source archive
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          bash scripts/release/package-version.sh
          poetry build --clean

      # Publish consumes these exact files after verification; the credential-bearing job does not rebuild them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resumeme-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
