name: Build stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
      refresh:
        description: Compile the fresh LinkedIn capture from this run
        type: boolean
        default: false
      summary:
        description: Consume the single generated summary for this pipeline run
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  container:
    name: Build and exercise runtime container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Load locally for smoke testing; registry credentials and pushes belong to the later publication stage.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: resumeme:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha,scope=resumeme-container-amd64
          cache-to: type=gha,mode=max,scope=resumeme-container-amd64
      - name: Compile a synthetic resume in the installed container
        run: bash scripts/ci/check-container.sh

      # Archive the tested image rather than asking deploy to rebuild from potentially changed external dependencies.
      - name: Save the tested image for tag publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p .cache/container
          docker save resumeme:ci | gzip > .cache/container/resumeme.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          name: resumeme-container
          path: .cache/container/resumeme.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  build:
    name: Package and compile PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}

      # resumeme build uses the digest-pinned drpsychick/texlive-pdflatex image.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.summary
        with:
          name: resumeme-summary
          path: .cache/codex/
      - run: bash scripts/ci/build.sh
        env:
          USE_CODEX_SUMMARY: ${{ inputs.summary }}
          RESUMEME_REPOSITORY_FORK: ${{ github.event.repository.fork == true }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # Routine refreshes publish an unsigned working PDF; only a user-created tag receives signing credentials.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resume-pdf
          path: .cache/publication/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resumeme-source
          path: tex/
          retention-days: 14

      # Publish consumes these exact files after verification; the credential-bearing job does not rebuild them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resumeme-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
