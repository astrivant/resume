name: Build stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
    secrets:
      COSIGN_PRIVATE_KEY:
        description: PEM-encoded signing key, used only for main-branch publication
        required: false
      COSIGN_PASSWORD:
        description: Password for the encrypted signing key
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  container:
    name: Build and exercise runtime container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Load locally for smoke testing; registry credentials and pushes belong to the later publication stage.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: resume:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha,scope=resume-container-amd64
          cache-to: type=gha,mode=max,scope=resume-container-amd64
      - name: Compile a synthetic resume in the installed container
        run: bash scripts/ci/check-container.sh
      # Archive the tested image rather than asking deploy to rebuild from potentially changed external dependencies.
      - name: Save the tested image for tag publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p .cache/container
          docker save resume:ci | gzip > .cache/container/resume.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          name: resume-container
          path: .cache/container/resume.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  build:
    name: Package and compile PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      # resume build uses the digest-pinned drpsychick/texlive-pdflatex image.
      - run: bash scripts/ci/build.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          cosign-release: v3.1.3
      # Scope the private key to signing; fork PR builds and ordinary compilation never receive it in their environment.
      - name: Sign and verify before uploading
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: poetry run bash scripts/release/sign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: signed-resume
          path: .cache/publication/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resume-source-and-distributions
          path: |
            tex/
            dist/
          retention-days: 14
