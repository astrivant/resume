name: Build stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
    secrets:
      COSIGN_PRIVATE_KEY:
        description: PEM-encoded signing key, used only for main-branch publication
        required: false
      COSIGN_PASSWORD:
        description: Password for the encrypted signing key
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Package and compile PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      # resume build uses the digest-pinned drpsychick/texlive-pdflatex image.
      - run: bash scripts/ci/build.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          cosign-release: v3.1.3
      - name: Sign and verify before uploading
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: poetry run bash scripts/release/sign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: signed-resume
          path: .cache/publication/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resume-source-and-distributions
          path: |
            tex/
            dist/
          retention-days: 14
