name: LinkedIn skill proposal stage
on:
  workflow_call:
    inputs:
      sha:
        description: Published tag revision supplying the configuration and code
        type: string
        required: true
      refresh:
        description: Consume the same fresh LinkedIn capture used to build the released PDF
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      LINKEDIN_USERNAME:
        required: false
      LINKEDIN_PASSWORD:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  generate:
    name: Propose skills from tagged profile evidence
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.settings.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - name: Prepare owner-bound prompt and schema
        id: settings
        env:
          OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python scripts/ci/skills-artifact.py prepare

      # Reuse the upstream action's isolation; the model has no LinkedIn credentials or profile-writing tools.
      - name: Generate skill suggestions
        if: steps.settings.outputs.enabled == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.161.0
          model: ${{ steps.settings.outputs.model }}
          effort: ${{ steps.settings.outputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: .cache/codex/skills/prompt.txt
          output-schema-file: .cache/codex/skills/schema.json
          output-file: .cache/codex/skills/skills.json
          codex-args: '["--ephemeral"]'
      - name: Validate evidence and proposal ownership
        if: steps.settings.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python scripts/ci/skills-artifact.py validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.settings.outputs.enabled == 'true'
        with:
          name: resumeme-skills
          path: .cache/codex/skills/skills.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Add missing skills to LinkedIn
    needs: generate
    if: needs.generate.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Share the existing profile-write lock with the About updater, including across different tagged releases.
    concurrency:
      group: resumeme-linkedin-ownership-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resumeme-skills
          path: .cache/codex/skills/
      - name: Skip superseded tag proposals
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          latest=$(bash scripts/tooling/retry.sh gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" == "$RELEASE_TAG" ]]; then
              echo 'current=true' >> "$GITHUB_OUTPUT"
          else
              echo 'Skipping skill additions: this tag is not the latest published release.'
          fi
      - name: Publish only missing skills and verify persistence
        if: steps.latest.outputs.current == 'true'
        env:
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run resumeme publish-skills --headless --tag "$RELEASE_TAG" --suggestions .cache/codex/skills/skills.json
