name: LinkedIn skill proposal stage
on:
  workflow_call:
    inputs:
      sha:
        description: Tagged source revision supplying the configuration and profile evidence
        type: string
        required: true
      refresh:
        description: Consume the same fresh LinkedIn capture used to build the released PDF
        type: boolean
        default: false
    outputs:
      publish:
        description: Whether the validated proposal is configured for LinkedIn publication
        value: ${{ jobs.generate.outputs.publish }}
    secrets:
      OPENAI_API_KEY:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  generate:
    name: Propose skills from tagged profile evidence
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.settings.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - name: Prepare owner-bound prompt and schema
        id: settings
        env:
          OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python scripts/ci/skills-artifact.py prepare

      # Reuse the upstream action's isolation; the model has no LinkedIn credentials or profile-writing tools.
      - name: Generate skill suggestions
        if: steps.settings.outputs.enabled == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.161.0
          model: ${{ steps.settings.outputs.model }}
          effort: ${{ steps.settings.outputs.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: .cache/codex/skills/prompt.txt
          output-schema-file: .cache/codex/skills/schema.json
          output-file: .cache/codex/skills/skills.json
          codex-args: '["--ephemeral"]'
      - name: Validate evidence and proposal ownership
        if: steps.settings.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python scripts/ci/skills-artifact.py validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.settings.outputs.enabled == 'true'
        with:
          name: resumeme-skills
          path: .cache/codex/skills/skills.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
