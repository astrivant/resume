name: Summary stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit used for summary evidence
        type: string
        required: true
      refresh:
        description: Consume the fresh LinkedIn capture from this run
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        description: OpenAI API key for the optional Codex summary
        required: false
    outputs:
      generated:
        description: Whether consumers must download the generated summary artifact
        value: ${{ jobs.prepare.outputs.generated }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Prepare generic and company summary requests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      generated: ${{ steps.prepare.outputs.enabled }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - name: Prepare filtered profile evidence and output schema
        id: prepare
        env:
          GENERATE_SUMMARY: >-
            ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
                (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
          OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: poetry run python scripts/ci/prepare-summary.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.enabled == 'true'
        with:
          name: resumeme-summary-inputs
          path: .cache/codex/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  summary:
    name: Summary (${{ matrix.key }})
    needs: prepare
    if: needs.prepare.outputs.generated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resumeme-summary-inputs
          path: .cache/codex/

      # Each matrix item owns one response; only this upstream action receives the API credential.
      - name: Generate About and portrait summaries
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.161.0
          model: ${{ matrix.model }}
          effort: ${{ matrix.effort }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: ${{ matrix.directory }}/prompt.txt
          output-schema-file: ${{ matrix.directory }}/schema.json
          output-file: ${{ matrix.directory }}/summary.json
          codex-args: '["--ephemeral"]'
      - name: Validate and stage the selected response
        env:
          SUMMARY_COMPANY: ${{ matrix.company }}
        run: poetry run python scripts/ci/summary-artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resumeme-summary-result-${{ matrix.key }}
          path: .cache/summary-result/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  collect:
    name: Collect verified summary matrix
    needs: [prepare, summary]
    if: needs.prepare.outputs.generated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: resumeme-summary-result-*
          merge-multiple: true
          path: .cache/codex/

      # Document review and PDF builds download these exact responses and employer snapshots.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resumeme-summary
          path: .cache/codex/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
