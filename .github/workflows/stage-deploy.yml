name: Deploy stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified source commit whose PDF may be published
        type: string
        required: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Commit verified PDF to main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: resume-pdf-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-resume
          path: .cache/publication/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify downloaded signatures and hashes
        run: bash scripts/release/verify.sh
      - name: Publish only if main has not advanced
        id: publish
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: bash scripts/ci/publish.sh
      - name: Release signed PDF and verification material
        if: steps.publish.outputs.published-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published-sha }}
        run: bash scripts/release/publish.sh
