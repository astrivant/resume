name: Deploy stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified source commit whose PDF may be published
        type: string
        required: true
      refresh:
        description: Commit the verified capture and referenced assets with the PDF
        type: boolean
        default: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Commit verified PDF to main
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Serialize PDF writers; publish.sh still checks for branch movement before committing or releasing an artifact.
    concurrency:
      group: resumeme-pdf-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resume-pdf
          path: .cache/publication/
      - name: Publish only if main has not advanced
        id: publish
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          REFRESH_PROFILE: ${{ inputs.refresh }}
        run: bash scripts/ci/publish.sh
