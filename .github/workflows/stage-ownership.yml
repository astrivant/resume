name: LinkedIn signing identity stage
on:
  workflow_call:
    inputs:
      sha:
        description: Published tag revision
        type: string
        required: true
    secrets:
      LINKEDIN_USERNAME:
        required: false
      LINKEDIN_PASSWORD:
        required: false
      RESUMEME_CACHE_PRIVATE_KEY:
        required: false
      RESUMEME_CACHE_PUBLIC_KEY:
        required: false
      RESUMEME_CACHE_KEY_PASSWORD:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  ownership:
    name: Update live About after publication
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ fromJSON(vars.RESUMEME_LINKEDIN_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    concurrency:
      group: resumeme-linkedin-ownership-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - id: settings
        run: poetry run python scripts/ci/linkedin/ownership-settings.py

      # Check GitHub's current latest release inside the serialized job, so rerunning an old tag cannot roll back the identity.
      - id: latest
        if: steps.settings.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          latest=$(bash scripts/tooling/retry.sh gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" == "$RELEASE_TAG" ]]; then
              echo 'current=true' >> "$GITHUB_OUTPUT"
          else
              echo 'Skipping ownership update: this tag is not the latest published release.'
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.latest.outputs.current == 'true'
        with:
          name: signed-resume
          path: .cache/publication
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.latest.outputs.current == 'true'
        with:
          cosign-release: v3.1.3
      - name: Verify the released key signed this PDF
        if: steps.latest.outputs.current == 'true'
        run: bash scripts/release/verify.sh

      # The browser receives LinkedIn credentials and the public key only; the private signing key stays in the release stage.
      - name: Maintain the public ownership lines
        id: publish_ownership
        if: steps.latest.outputs.current == 'true'
        continue-on-error: true
        env:
          RESUMEME_LOG_LEVEL: DEBUG
          PYTHONUNBUFFERED: '1'
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        uses: ./.github/actions/linkedin-session
        with:
          command: publish-ownership
          private-key: ${{ secrets.RESUMEME_CACHE_PRIVATE_KEY }}
          public-key: ${{ secrets.RESUMEME_CACHE_PUBLIC_KEY }}
          key-password: ${{ secrets.RESUMEME_CACHE_KEY_PASSWORD }}
          cache-directory: ${{ vars.RESUMEME_SESSION_CACHE_DIR }}

      # A browser or LinkedIn confirmation failure must not invalidate the published signed release.
      - name: Warn if LinkedIn ownership update was not confirmed
        if: steps.publish_ownership.outcome == 'failure'
        run: |
          echo "::warning title=Optional LinkedIn ownership update::LinkedIn did not confirm the About update. It may have reached the profile; inspect the About section before retrying."
          {
            printf '%s\n' \
              '### Warning: LinkedIn ownership update was not confirmed' \
              '' \
              'LinkedIn did not confirm the About update. It may have reached the profile. Inspect the About section before retrying. The signed release remains available.'
          } >> "$GITHUB_STEP_SUMMARY"
