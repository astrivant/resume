name: Scorecard stage
on:
  workflow_call:
permissions:
  contents: read

# The publishing API verifies this reusable workflow's OIDC identity; keep its approved steps free of env and defaults.
jobs:
  analysis:
    name: Publish Scorecard results
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

      # Authenticate public results with GitHub OIDC; no additional repository secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze and publish the score used by the README badge
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: true
