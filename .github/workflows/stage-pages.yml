name: Pages stage
on:
  workflow_call:
    inputs:
      sha:
        description: Accepted main commit containing the published PDF and its profile
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Prepare static resume site
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.settings.outputs.enabled }}
      path: ${{ steps.settings.outputs.path }}
      custom-domain: ${{ steps.settings.outputs.custom-domain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - id: settings
        run: poetry run python scripts/ci/pages-settings.py

      # Relative links keep the same artifact usable at a custom domain, a project site, or a configured subdirectory.
      - name: Render index.html and copy the accepted PDF
        if: steps.settings.outputs.enabled == 'true'
        run: poetry run resumeme site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.settings.outputs.enabled == 'true'
        with:
          path: .cache/pages/
          retention-days: 7
  deploy:
    name: Update GitHub Pages
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.destination.outputs.url }}

    # Serialize site writers and check main after queueing; an older completed build must not replace a newer site.
    concurrency:
      group: resumeme-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Confirm the accepted commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ inputs.sha }}
        run: bash scripts/ci/pages-current.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        if: steps.current.outputs.current == 'true'
      - name: Validate the configured hostname and publish the site URL
        id: destination
        if: steps.current.outputs.current == 'true'
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          EXPECTED_DOMAIN: ${{ needs.prepare.outputs.custom-domain }}
          PUBLICATION_PATH: ${{ needs.prepare.outputs.path }}
        run: bash scripts/ci/pages-destination.sh
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        if: steps.current.outputs.current == 'true'
