name: Container publication stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified source commit whose container may be published
        type: string
        required: true
    outputs:
      ghcr-tags:
        description: References successfully published to GHCR
        value: ${{ jobs.publish.outputs.tags }}
      dockerhub-tags:
        description: References successfully published to Docker Hub
        value: ${{ jobs.dockerhub.outputs.tags }}
    secrets:
      DOCKER_HUB_TOKEN_EMMEOWZING:
        description: Organization Docker Hub token for the upstream emmeowzing/resumeme image
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    name: Push verified container to GHCR
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.publish.outcome == 'success' && steps.metadata.outputs.tags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resumeme-container
          path: .cache/container/

      # Derive fork-local image names and tag aliases from GitHub context, without moving a shared latest tag.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ inputs.sha }}

      # Authenticate only after verification, with the job-scoped package token rather than a long-lived registry secret.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image without rebuilding
        id: publish
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: bash scripts/ci/publish-container.sh
  # Forks retain GHCR publication but never start a runner or require a token for this upstream-only destination.
  dockerhub:
    name: Push verified container to Docker Hub
    if: >-
      github.repository == 'astrivant/resumeme'
      && github.event.repository.fork == false
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.publish.outcome == 'success' && steps.metadata.outputs.tags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resumeme-container
          path: .cache/container/

      # Bind both aliases to the verified source supplied by the entry workflow, including annotated Git tags.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: emmeowzing/resumeme
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ inputs.sha }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: emmeowzing
          password: ${{ secrets.DOCKER_HUB_TOKEN_EMMEOWZING }}
      - name: Publish the tested image without rebuilding
        id: publish
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: bash scripts/ci/publish-container.sh
