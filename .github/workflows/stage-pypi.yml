name: PyPI stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified source commit whose Python distributions may be published
        type: string
        required: true
    secrets:
      PYPI_API_TOKEN:
        description: PyPI token from the organization, repository, or pypi environment
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    name: Publish verified distributions to PyPI
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/resumeme/
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: resumeme-pypi-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # Upload needs Poetry alone; dependencies and source distributions were already built by the verified stage.
      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resumeme-python-distributions
          path: dist/
      - name: Publish wheel and source distribution
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          POETRY_KEYRING_ENABLED: 'false'
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/publish-package.sh
