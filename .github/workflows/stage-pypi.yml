name: PyPI stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified source commit whose Python distributions may be published
        type: string
        required: true
    secrets:
      PYPI_API_TOKEN:
        description: PyPI token from the organization, repository, or pypi environment
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    name: Publish verified distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/resumeme/
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: resumeme-pypi-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      # Upload needs Poetry alone; dependencies and source distributions were already built by the verified stage.
      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resumeme-python-distributions
          path: dist/
      - name: Publish wheel and source distribution
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          POETRY_KEYRING_ENABLED: 'false'
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/publish-package.sh
