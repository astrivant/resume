name: Resumeme pipeline
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  schedule:
    # Refresh on the first of each month at 06:17 UTC, away from the busiest start-of-hour queue.
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Capture LinkedIn again before rebuilding main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: resumeme-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:

  # Resolve once so every reusable stage consumes the same commit even if the branch advances during the run.
  source:
    name: Resolve pipeline source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      refresh: ${{ steps.source.outputs.refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        env:
          REFRESH_PROFILE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
        run: bash scripts/ci/source.sh
      - uses: ./.github/actions/setup-project
        if: steps.source.outputs.refresh == 'true'
        with:
          groups: main

      # Hosted Ubuntu includes Firefox and Chrome with their drivers; capture.browser selects one.
      # Only this step receives LinkedIn authentication secrets.
      - name: Refresh LinkedIn profile and downloaded media
        if: steps.source.outputs.refresh == 'true'
        env:
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: poetry run resumeme capture --headless
      - name: Export complete capture for downstream stages
        if: steps.source.outputs.refresh == 'true'
        run: poetry run python scripts/ci/profile-artifact.py export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.source.outputs.refresh == 'true'
        with:
          name: resumeme-profile
          path: .cache/refresh/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  summary-stage:
    name: Summarize
    needs: source
    uses: ./.github/workflows/stage-summary.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  test-stage:
    name: Test
    needs: [source, summary-stage]
    uses: ./.github/workflows/stage-test.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
      summary: ${{ needs.summary-stage.outputs.generated == 'true' }}
  build-stage:
    name: Build
    needs: [source, summary-stage]
    uses: ./.github/workflows/stage-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
      summary: ${{ needs.summary-stage.outputs.generated == 'true' }}

  # Run the gate after failures too; a skipped or cancelled upstream stage must never look like successful verification.
  verified:
    name: CI verification
    if: always()
    needs: [source, summary-stage, test-stage, build-stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all stages to succeed
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS_JSON"

  # PDF publication owns repository writes and only runs for main, after the common verification gate.
  deploy-stage:
    name: Publish PDF
    needs: [source, verified]
    # Token-authenticated publication commits run normal CI, but their parent run already published these outputs.
    # Gate only republishing on a main push; tagging that generated commit must still capture and release normally.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      !(github.event_name == 'push' &&
        github.event.head_commit.author.name == 'github-actions[bot]' &&
        contains(github.event.head_commit.message, 'Resumeme-Publication: true'))
    uses: ./.github/workflows/stage-deploy.yml
    permissions:
      contents: write
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      RESUME_PUBLISH_TOKEN: ${{ secrets.RESUME_PUBLISH_TOKEN }}

  # Pages consumes the accepted main commit in this run; bot commits do not trigger another workflow with GITHUB_TOKEN.
  pages-stage:
    name: Publish resume website
    needs: deploy-stage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.deploy-stage.outputs.published-sha != ''
    uses: ./.github/workflows/stage-pages.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      sha: ${{ needs.deploy-stage.outputs.published-sha }}

  # Tags capture LinkedIn first and release the PDF built from that capture; branch and monthly runs create no release.
  release-stage:
    name: Release signed PDF
    needs: [source, verified]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-release.yml
    permissions:
      contents: write
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # Profile writes are a separate opt-in stage; login failures leave the published release and container stage intact.
  ownership-stage:
    name: Publish signing identity to LinkedIn
    needs: [source, release-stage]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-ownership.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}

  # Skill proposals and optional additions run only after a signed tag release, independently of main's summary jobs.
  skills-stage:
    name: Propose and optionally publish LinkedIn skills
    needs: [source, release-stage]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-skills.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      refresh: ${{ needs.source.outputs.refresh == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}

  # Version tags publish the verified Python distributions; the PyPI credential reaches only this stage.
  pypi-stage:
    name: Publish Python package
    needs: [source, verified]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/stage-pypi.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # Tag publication owns registry writes and container release notes; branch and PR builds only exercise the image.
  container-stage:
    name: Publish container
    needs: [source, verified, release-stage]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/stage-container.yml
    permissions:
      contents: write
      packages: write
    with:
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      DOCKER_HUB_TOKEN_EMMEOWZING: ${{ secrets.DOCKER_HUB_TOKEN_EMMEOWZING }}
