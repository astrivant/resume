name: Trivy PR summary
on:
  workflow_run:
    workflows: [Resumeme pipeline]
    types: [completed]
permissions: {}
concurrency:
  group: resumeme-trivy-pr-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  comment:
    name: Post security scan summary
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # workflow_run executes this trusted default-branch script, never code from the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: trivy-scan-report
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/trivy-results

      - name: Resolve the report and create a safe comment payload
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "trivy-scan-report")][0].id // empty')
          artifact_url=
          if [[ -n "$artifact_id" ]]; then
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$artifact_id"
          fi
          python3 scripts/ci/trivy-report.py comment \
            --input "$RUNNER_TEMP/trivy-results/trivy-report.json" \
            --output "$RUNNER_TEMP/trivy-comment.json" \
            --artifact-url "$artifact_url" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

      - name: Create or update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          existing_comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- resumeme-trivy-scan -->")) | .id' | tail -n 1)
          if [[ -n "$existing_comment_id" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" \
                --input "$RUNNER_TEMP/trivy-comment.json"
          else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --input "$RUNNER_TEMP/trivy-comment.json"
          fi
