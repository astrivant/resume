name: Document review stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
      refresh:
        description: Validate the fresh LinkedIn capture from this run
        type: boolean
        default: false
      summary:
        description: Review the same generated copy used to build the PDF
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  documents:
    name: TeXtidote spelling, grammar, and LaTeX review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'repository_dispatch'
        with:
          name: awareness-figures
          path: data/

      # Check the rendered document from this source commit, including a user's configured output.tex path.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.summary
        with:
          name: resumeme-summary
          path: .cache/codex/
      - name: Render the resume and prepare report paths
        id: documents
        env:
          USE_CODEX_SUMMARY: ${{ inputs.summary }}
        run: bash scripts/ci/resume/render.sh

      # Run the Marketplace action's published image directly: its action.yml otherwise selects a floating latest tag.
      # https://github.com/marketplace/actions/textidote-action
      - name: Review generated LaTeX and profile prose
        id: resume
        if: >-
          ${{ !cancelled()
          && steps.documents.outcome == 'success' }}
        uses: docker://gokhlayeh/textidote@sha256:f0fe1a468f9818e2a91f7c660f25f7a17ba7ff1cd39e7daee32bdee7533f1441
        with:
          args: >-
            ./${{ steps.documents.outputs.tex_file }}
            ${{ steps.documents.outputs.tex_directory }}
            html ${{ steps.documents.outputs.tex_report }}
            -1 "--check en"

      # Keep editorial findings visible without rewriting captured profile prose; execution failures still fail the test stage.
      - name: Summarize document review
        if: always()
        env:
          RESUME_WARNINGS: ${{ steps.resume.outputs.num_warnings }}
        run: |
          {
              printf '## TeXtidote review\n\n'
              printf '| Document | Findings |\n| --- | --- |\n'
              printf '| Resume | %s |\n\n' "${RESUME_WARNINGS:-unavailable}"
              printf 'Download the textidote-reports artifact for annotated HTML. Prose findings are advisory; tool failures block CI.\n'
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ "${RESUME_WARNINGS:-0}" != 0 ]]; then
              echo '::warning::TeXtidote found prose issues. Review the textidote-reports artifact.'
          fi

      # Preserve the completed report even after failure; README review publishes its own artifact on the source-only branch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          always()
          && steps.documents.outcome == 'success'
        with:
          name: textidote-reports
          path: .cache/textidote/*.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
