name: Test stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Lint, types, and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: scripts/validation/math/package-lock.json
      - run: bash scripts/ci/checks/test.sh checks

  python:
    name: Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_COUNT: ${{ strategy.job-total }}
      COVERAGE_FILE: .cache/coverage/.coverage.shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project

      # Each public Ubuntu runner provides four CPUs; workers collect the same deterministic partition.
      - run: bash scripts/ci/checks/test.sh tests --shard-index "$TEST_SHARD_INDEX" --shard-count "$TEST_SHARD_COUNT" -n 4

      # Unique filenames retain every shard's raw coverage, including diagnostics from failed tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .cache/coverage/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Combine test coverage
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-*
          path: .cache/coverage/shards
          merge-multiple: true

      # Wait for every shard before producing the complete report consumed by the existing coverage badge.
      - name: Combine all shard data
        run: |
          poetry run coverage combine --keep .cache/coverage/shards
          poetry run coverage report
          poetry run coverage xml -o .cache/coverage/coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: .cache/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 14
