name: Test stage
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
      refresh:
        description: Validate the fresh LinkedIn capture from this run
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  python:
    name: Lint, types, contracts, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: ./.github/actions/restore-profile
        with:
          refresh: ${{ inputs.refresh }}
      - run: bash scripts/ci/test.sh

      # Preserve coverage diagnostics on test failure too; the pipeline gate still requires this job to succeed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-coverage
          path: .cache/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 14
