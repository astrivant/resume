name: Signed PDF release stage
on:
  workflow_call:
    inputs:
      sha:
        description: Verified tagged revision containing the PDF selected for sharing
        type: string
        required: true
    secrets:
      COSIGN_PRIVATE_KEY:
        description: PEM-encoded private signing key
        required: true
      COSIGN_PASSWORD:
        description: Password for the encrypted signing key
        required: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  release:
    name: Sign and release the tagged PDF
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: resumeme-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          groups: main

      # Sign the exact PDF selected by the tag, including any Codex copy already committed by the monthly build.
      - name: Stage the committed PDF
        run: poetry run python scripts/ci/stage-pdf.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify the selected PDF
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: poetry run bash scripts/release/sign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-resume
          path: .cache/publication/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified signatures, hashes, and fingerprint on the chosen tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/publish.sh
