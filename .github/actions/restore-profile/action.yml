name: Restore captured profile
description: Use the same complete capture in every consumer of this pipeline run
inputs:
  refresh:
    description: Whether the source stage uploaded a fresh LinkedIn capture
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.refresh == 'true'
      with:
        name: resumeme-profile
        path: .cache/refresh/
    - name: Restore configured profile and referenced media
      if: inputs.refresh == 'true'
      shell: bash
      run: poetry run python scripts/ci/linkedin/profile-artifact.py restore
