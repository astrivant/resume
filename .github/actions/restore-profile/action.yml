name: Restore captured profile
description: Use the same complete monthly capture in every consumer of this pipeline run
inputs:
  refresh:
    description: Whether the source stage uploaded a fresh LinkedIn capture
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      if: inputs.refresh == 'true'
      with:
        name: resumeme-profile
        path: .cache/refresh/
    - name: Restore configured profile and referenced media
      if: inputs.refresh == 'true'
      shell: bash
      run: poetry run python scripts/ci/profile-artifact.py restore
