name: Set up resumeme
description: Reuse locked dependency environments and install the current resumeme checkout
inputs:
  groups:
    description: main for rendering, main,dev for validation
    default: main,dev
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-poetry
    - name: Identify compatible project environment
      id: environment
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
      run: python scripts/tooling/cache-keys.py project >>"$GITHUB_OUTPUT"
    - name: Restore locked dependencies
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.environment.outputs.path }}
        key: ${{ steps.environment.outputs.key }}
    - name: Validate lockfile and prepare dependencies
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        PROJECT_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: bash scripts/tooling/setup-env.sh

    # Cache dependencies before installing the editable checkout or running any commands that use credentials.
    - name: Save locked dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.environment.outputs.path }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Install current resumeme checkout without fetching dependencies
      shell: bash
      run: poetry install --only-root --no-interaction --no-ansi
