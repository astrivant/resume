name: Set up resume
description: Install the selected dependency groups from the committed Poetry lockfile
inputs:
  groups:
    description: main for rendering, main,dev for validation
    default: main,dev
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: .python-version
    - name: Install locked dependencies
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
      run: bash scripts/tooling/setup-env.sh
