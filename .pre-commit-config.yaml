default_language_version:
  python: python3.13
  node: 26.10.0
repos:
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.10.0
    hooks:
      - id: eslint
        name: ESLint LinkedIn browser scripts
        files: '^pkg/resumeme/linkedin/scripts/.*\.js$'
  - repo: local
    hooks:
      # Run the published hook command against the latest checkout, using the project's existing locked environment.
      - id: resumeme-config-validator
        name: Validate resumeme configurations
        entry: bash scripts/tooling/project-python.sh -m resumeme.cli config lint
        language: system
        files: '^resumeme\.config(?:\.ref)?\.yaml$'
        types: [yaml]
        require_serial: true
      - id: pydocstyle
        name: Google docstring style
        entry: bash scripts/tooling/project-python.sh -m pydocstyle --config=pyproject.toml
        language: system
        types: [python]
      - id: pydoclint
        name: Typed docstring contracts
        entry: bash scripts/tooling/project-python.sh -m pydoclint.main --config=pyproject.toml
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: bash scripts/tooling/project-python.sh -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: bash scripts/tooling/project-python.sh -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: bash scripts/tooling/project-python.sh -m mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: ShellCheck and shfmt
        entry: bash scripts/validation/check-shell.sh
        language: system
        types: [shell]
      - id: schemas
        name: Configuration and profile schemas
        entry: bash scripts/tooling/project-python.sh scripts/validation/check-data.py
        language: system
        pass_filenames: false
        files: '(\.json$|\.yaml$|\.yml$|^Dockerfile$|^pkg/resumeme/(config\.py|compiler/asts/.*\.py)$)'
