# yaml-language-server: $schema=./pkg/resumeme/compiler/asts/resources/config.schema.json
linkedin:
  username: emmeowzing

# Optional public profile link; set username to null to hide it.
github:
  username: emmeowzing

# Optional Codex-generated About and portrait summary. Set OPENAI_API_KEY as an Actions secret before enabling.
codex:
  enabled: false
  model: null
  about_max_words: 100
  headline_max_words: 18

  # Add target roles, audience, tone, or additional factual background here. Never put an API key in this file.
  context: ''

# Enabled sections in PDF/contents order. Reorder entries; comment out a key to hide that section.
# Uncomment it to restore the section. Missing/empty sections are skipped; [] renders only the profile header.
# Add unfamiliar keys from data/profile.json to include them. Featured uses the same tiles as Projects.
section_order:
  # - contact
  - about
  # - featured
  - activity
  - experience
  - education
  - services
  - career-breaks
  - certifications
  - volunteering-experiences
  - projects
  - publications
  - patents
  - courses
  - honors
  - test-scores
  - skills
  # - recommendations
  # - languages
  # - organizations
  # - interests
  # - causes

experience:

  # Match a job title, company, or both (case-insensitive).
  # Example: [{title: DevOps Engineer, company: HqO}]
  disable:
    - title: Founder
      company: PremiScale

  # Set to 5 to include jobs overlapping the past five years, including ongoing jobs.
  last_years: null

  # Optional fixed endpoint for reproducible date filtering, e.g. '2026-10-07'.
  # null uses today's UTC date. Keep explicit dates quoted.
  as_of: '2020-06-01'
capture:
  page_timeout_seconds: 30
  max_scrolls: 60
  max_pages_per_section: 30
  fetch_link_previews: true
  retry_attempts: 5
  retry_backoff_seconds: 10
  retry_max_backoff_seconds: 300
output:
  profile: data/profile.json
  assets: data/assets
  tex: tex/resume.tex
  pdf: resume.pdf
style:
  show_headline: false

  # null uses the base style below; set tiger to apply the matching overrides in themes.
  theme: tiger

  # US Letter (8.5 x 11 inches); set a4 for ISO A4.
  paper: letter

  # Deep plant green identifies clickable text; neutral headings use size and weight for hierarchy.
  accent: '245135'
  skill_colors: ['777777', '363636']
  background: FFFFFF
  font_size: 10

  # Soft charcoal for normal text and bold entry titles on white paper.
  ink: '363636'
  entry_color: '363636'

  # Set true to display the cover/background photo; the portrait stays visible.
  show_header_photo: false

  # Link visible sections beneath the LinkedIn profile link in the first-page left column.
  show_table_of_contents: true

  # Optional connection metadata below the LinkedIn profile link. Enable either or both.
  show_connection_count: false
  show_connection_link: false

  # Display the birthday only when Contact info is enabled (uncomment contact in section_order).
  display_birthday: false

  # Size the top 20 skills by references + 2 * endorsements; skill_colors runs from 0% to 100% of the highest displayed count.
  skills_word_cloud: true

  # Each named theme can override any presentation field above, or the text/cloud colors below.
  # Theme fields win over base style fields; omitted fields keep their base values.
  themes:
    tiger:

      # Name > section headings > entry titles/body: burgundy, burnt orange, then soft charcoal.
      # Green marks links; skill colors progress from muted brown to burgundy as endorsement counts increase.
      # Source and palette roles: docs/themes.md
      accent: '245135'
      ink: '363636'
      name_color: '6B2737'
      heading_color: 'A44813'
      entry_color: '363636'
      skill_colors: ['9A7663', '6B2737']

# Optional exact template override; otherwise the package template is used.
template: null
